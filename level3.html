<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💀 المرحلة الثالثة</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="blood-drip"></div>
    
    <div class="container">
        <h1>🔺 المرحلة الأخيرة 🔺</h1>
        
        <p class="message">اختر الترتيب الصحيح... قبل فوات الأوان</p>
        
        <div class="timer" id="timer">02:00</div>
        
        <div class="symbols-grid">
            <div class="symbol-box" data-symbol="circle" onclick="selectSymbol(this)">⚪</div>
            <div class="symbol-box" data-symbol="triangle" onclick="selectSymbol(this)">🔺</div>
            <div class="symbol-box" data-symbol="square" onclick="selectSymbol(this)">🟦</div>
        </div>
        
        <p class="message">الترتيب المختار: <span id="selected" style="color: #ff0000;">-</span></p>
        
        <button onclick="checkSymbols()">🩸 تحقق 🩸</button>
        
        <div class="error" id="error">❌ الترتيب خاطئ... الظلام يبتلعك ❌</div>
        
        <div class="hint" id="hint">
            💀 فكر بشكل له اربعه اضلاع وشكلين لهم ثلاثه اضلاع 💀
        </div>
    </div>

    <script>
        let timeLeft = 120;
        let timerInterval;
        let selectedSymbols = [];

        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                document.getElementById('timer').textContent = 
                    `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    document.getElementById('hint').classList.add('show');
                }
            }, 1000);
        }

        function selectSymbol(element) {
            const symbol = element.dataset.symbol;
            
            if (selectedSymbols.length < 3) {
                selectedSymbols.push(symbol);
                element.classList.add('selected');
                
                const symbolsText = selectedSymbols.map(s => {
                    if (s === 'circle') return '⚪';
                    if (s === 'triangle') return '🔺';
                    if (s === 'square') return '🟦';
                }).join(' ');
                
                document.getElementById('selected').textContent = symbolsText;
            }
        }

        function checkSymbols() {
            const correctOrder = ['square', 'triangle', 'triangle'];
            
            if (JSON.stringify(selectedSymbols) === JSON.stringify(correctOrder)) {
                clearInterval(timerInterval);
                window.location.href = 'level4.html';
            } else {
                document.getElementById('error').classList.add('show');
                setTimeout(() => {
                    document.getElementById('error').classList.remove('show');
                    selectedSymbols = [];
                    document.querySelectorAll('.symbol-box').forEach(box => {
                        box.classList.remove('selected');
                    });
                    document.getElementById('selected').textContent = '-';
                }, 2000);
            }
        }

        startTimer();
    </script>
</body>
</html>
